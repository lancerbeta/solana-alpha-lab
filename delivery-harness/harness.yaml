schema: smial.delivery-harness
schema_version: '1.0'
harness_id: DELIVERY_HARNESS_V1
active_routes:
  - DIRECT_CODEX_DELIVERY
  - DIRECT_CURSOR_DELIVERY
  - DESIGN_ONLY
forbidden_active_input_routes:
  - GITHUB_BATON
routes:
  DIRECT_CODEX_DELIVERY:
    active: true
    actor: CODEX
    task_selection: explicit_owner_or_canonical_ready_contract_only
    merge: EXACT_OWNER_APPROVAL_AND_MACHINE_GATE
  DIRECT_CURSOR_DELIVERY:
    active: true
    actor: CURSOR
    task_selection: explicit_owner_or_canonical_ready_contract_only
    merge: EXACT_OWNER_APPROVAL_AND_MACHINE_GATE
  DESIGN_ONLY:
    active: true
    actor: ANY
    task_selection: explicit_input_only
    merge: FORBIDDEN
  LEGACY_GITHUB_BATON_DORMANT:
    active: false
    actor: CURSOR
    task_selection: false
    merge: FORBIDDEN
merge_policy:
  executor: DIRECT_AGENT
  owner_role: EXACT_PHRASE_AFTER_CI
  owner_github_merge_click: FORBIDDEN
  identity_modes:
    - TASK_CONTEXT_RECEIPT
    - LIVE_PR_HEAD
  harness_control_write_prefixes:
    - AGENTS.md
    - .agents/skills/delivery-harness/**
    - .cursor/rules/00-authority.mdc
    - .cursor/rules/05-language-and-reporting.mdc
    - .cursor/rules/10-input-routing.mdc
    - .cursor/rules/20-validation.mdc
    - .cursor/rules/30-security-and-secrets.mdc
    - .cursor/rules/40-catalog-and-evidence.mdc
    - .cursor/rules/50-factory-remote-host.mdc
    - .cursor/commands/delivery-finish.md
    - .cursor/commands/delivery-review.md
    - .cursor/commands/delivery-start.md
    - .cursor/commands/delivery-status.md
    - .cursor/agents/architecture-critic.md
    - .cursor/agents/code-reviewer.md
    - .cursor/agents/goal-dod-critic.md
    - .cursor/agents/owner-ux-critic.md
    - .cursor/agents/refactor-critic.md
    - .github/workflows/**
    - .github/pull_request_template.md
    - .github/ISSUE_TEMPLATE/control-atom.yml
    - catalog/schemas/delivery_harness.schema.json
    - catalog/schemas/delivery_harness_capability_radar.schema.json
    - catalog/schemas/delivery_harness_completion_evidence.schema.json
    - catalog/schemas/delivery_harness_context_map.schema.json
    - catalog/schemas/delivery_harness_context_receipt.schema.json
    - catalog/schemas/delivery_harness_independent_review_evidence.schema.json
    - catalog/schemas/delivery_harness_project_profile.schema.json
    - catalog/schemas/delivery_harness_task_contract.schema.json
    - catalog/schemas/owner_attention_gate_v2.schema.json
    - control/owner_attention_gate_v2.yaml
    - control/owner_attention_gate_v1.yaml
    - control/active_time_gates.json
    - delivery-harness/**
    - docs/agent/DELIVERY_HARNESS_PROTOCOL.md
    - docs/agent/DELIVERY_CONTEXT_PROTOCOL.md
    - docs/agent/DELIVERY_HARNESS_BOOTSTRAP.md
    - docs/agent/EXECUTION_ROUTER_PROTOCOL.md
    - docs/evidence/control/**
    - scripts/delivery_harness.py
    - scripts/owner_attention_gate.py
    - scripts/harness_sync.py
    - scripts/delivery_efficiency.py
    - scripts/semantic_premise_review_cli.py
    - scripts/secret_scan.py
    - tests/test_delivery_harness_adapters.py
    - tests/test_delivery_harness_stable_asset_references.py
    - tests/test_delivery_harness_authority.py
    - tests/test_delivery_harness_bootstrap.py
    - tests/test_delivery_harness_context.py
    - tests/test_delivery_harness_contract.py
    - tests/test_delivery_harness_merge_guard.py
    - tests/test_delivery_harness_factory_v1_readiness_bind.py
    - tests/test_delivery_harness_skill.py
    - tests/test_autonomous_delivery_skill.py
    - tests/test_harness_sync.py
    - tests/test_harness_sync_bindings.py
    - tests/test_process_throughput_guardrails.py
context_lanes:
  L0: always_loaded_front_door
  L1: exact_task_capsule
  L2: dynamic_capability_context
  L3: deep_evidence_on_demand
context_budgets:
  agents_max_bytes: 12288
  cursor_always_apply_max_bytes: 6144
  ordinary_receipt_max_bytes: 49152
  auto_inline_file_max_bytes: 102400
portable_bundle:
  execution_inventory_owner: PORTABLE_BUNDLE_MANIFEST
  manifest_path: delivery-harness/templates/portable-bundle-manifest.json
  entry_artifacts:
    - delivery-harness/templates/portable-project-profile.yaml
    - delivery-harness/templates/bootstrap-prompt.md
cloud_bundle:
  mode: OWNER_MANAGED_OPTIONAL_EXPORT
  execution_gate: false
  done_gate: false
  smoke_required_by_harness: false
  reminders: false
  working_context_truth_owner: false
  historical_registry_preserved: true
external_authority:
  external_system: false
  signing_or_financial_action: false
  cash_spend: false
  cloud_activation: false
