schema: smial.delivery-harness-capability-radar
schema_version: '1.0'
radar_id: DELIVERY_CAPABILITY_RADAR_V1
harness_id: DELIVERY_HARNESS_V1
default_decision: NONE
max_candidates: 1
authority:
  install: false
  credentials: false
  network: false
  paid_plan: false
candidates:
  - candidate_id: SENTRY_OR_EQUIVALENT
    conditions_all: [first_unattended_runtime, named_incident_consumer]
    named_consumer_required: true
    adoption_order: [ADOPT, WRAP, FORK, BUILD]
    fallback_without_tool: repository_native_runtime_receipts
    exit_path: remove_adapter_and_preserve_receipts
  - candidate_id: POSTHOG_OR_EQUIVALENT
    conditions_all: [owner_cockpit_workflow, named_behavior_question]
    named_consumer_required: true
    adoption_order: [ADOPT, WRAP, FORK, BUILD]
    fallback_without_tool: repository_native_owner_event_log
    exit_path: export_events_and_remove_adapter
  - candidate_id: CLICKHOUSE_OR_REMOTE_ANALYTICS
    conditions_all: [measured_duckdb_boundary, second_analytics_consumer]
    named_consumer_required: true
    adoption_order: [ADOPT, WRAP, FORK, BUILD]
    fallback_without_tool: bounded_duckdb_parquet_workflow
    exit_path: retain_parquet_and_drop_remote_adapter
  - candidate_id: CONTEXT7_OR_DOCS_MCP
    conditions_all: [two_material_version_documentation_delays]
    named_consumer_required: true
    adoption_order: [ADOPT, WRAP, FORK, BUILD]
    fallback_without_tool: official_web_documentation_search
    exit_path: remove_connector_and_keep_source_links
