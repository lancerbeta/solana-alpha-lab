schema: smial.delivery-harness-context-map
schema_version: '1.0'
context_map_id: DELIVERY_CONTEXT_MAP_V1
harness_id: DELIVERY_HARNESS_V1
roles:
  - semantic_role: MISSION_AND_INVARIANTS
    lane: L0
    truth_owner: REPOSITORY_POLICY
    missingness: ERROR
    resolver:
      kind: EXACT_PATHS
      paths: [AGENTS.md, delivery-harness/project-profile.yaml]
  - semantic_role: PRODUCT_ROADMAP
    lane: L1
    truth_owner: EXACT_GIT_ROADMAP_BINDING
    missingness: EXPLICIT_GAP
    resolver:
      kind: EXACT_INPUT
      paths: []
  - semantic_role: ACTIVE_BOUNDED_WORK
    lane: L1
    truth_owner: EXACT_TASK_CONTRACT
    missingness: ERROR
    resolver:
      kind: EXACT_INPUT
      paths: []
  - semantic_role: IMPLEMENTATION_STATE
    lane: L1
    truth_owner: GIT
    missingness: ERROR
    resolver:
      kind: GIT_IDENTITY
      paths: []
  - semantic_role: STABLE_ASSETS_AND_RELATIONS
    lane: L1
    truth_owner: CATALOG
    missingness: EXPLICIT_GAP
    resolver:
      kind: CATALOG_QUERY
      paths: [catalog/catalog_manifest.yaml]
  - semantic_role: LIFECYCLE
    lane: L2
    truth_owner: VERSIONED_REGISTRIES
    missingness: EXPLICIT_GAP
    resolver:
      kind: EXACT_PATHS
      paths: [registries]
  - semantic_role: EXTERNAL_ROUTE_KNOWLEDGE
    lane: L2
    truth_owner: PROVIDER_ROUTE_REGISTRY
    missingness: EXPLICIT_GAP
    resolver:
      kind: CATALOG_QUERY
      paths: [catalog/catalog_manifest.yaml]
  - semantic_role: ARCHITECTURE_DECISIONS
    lane: L2
    truth_owner: ADR_AND_INTENT_REGISTRIES
    missingness: EXPLICIT_GAP
    resolver:
      kind: CATALOG_QUERY
      paths: [catalog/assets/architecture.yaml]
  - semantic_role: DELIVERY_EVIDENCE
    lane: L2
    truth_owner: EXACT_CANDIDATE_EVIDENCE
    missingness: EXPLICIT_GAP
    resolver:
      kind: CATALOG_QUERY
      paths: [catalog/assets/core.yaml]
  - semantic_role: HISTORICAL_CONTEXT
    lane: L3
    truth_owner: ARCHIVES_AND_SUPERSEDED_RELEASES
    missingness: EXPLICIT_GAP
    resolver:
      kind: SOURCE_RELEASE_REGISTRY
      paths: [docs/project_sources/release_registry_v1.yaml]
