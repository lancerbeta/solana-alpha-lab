name: Factory operability resource proof

on:
  workflow_call:

permissions:
  contents: read

jobs:
  watch-and-pulse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_ENV_FILE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected resource proof
        id: scope
        env:
          RESOURCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          base = os.environ.get('RESOURCE_BASE', '')
          affected = {
              'src/solana_alpha_lab/factory/observation_schedule_store.py',
              'src/solana_alpha_lab/factory/research_store.py',
              'src/solana_alpha_lab/factory/observation_schedule_lifecycle.py',
              'src/solana_alpha_lab/factory/collector_operational_packet.py',
              'src/solana_alpha_lab/factory/collector_read_model.py',
              'src/solana_alpha_lab/factory/operability_watch.py',
              'src/solana_alpha_lab/factory/collector_owner_pulse.py',
              'scripts/factory_operability_watch.py',
              'scripts/collector_owner_pulse.py',
              'tests/operability_bounded_call_profile.py',
              'tests/test_factory_operability_live_resource_gate_repair_v1.py',
              'scripts/factory_prepare_operability_index.py',
              '.github/workflows/factory-operability-resource-proof.yml',
              '.github/workflows/ci.yml',
          }
          required = True
          if base and set(base) != {'0'}:
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              required = bool(affected.intersection(changed))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(required).lower() + '\n')
          print('RESOURCE_PROOF_REQUIRED=' + str(required).lower())
          PY
      - if: steps.scope.outputs.required == 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          checksum: "04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829"
          python-version: "3.13.14"
          enable-cache: false
      - if: steps.scope.outputs.required == 'true'
        name: Frozen-base falsifier and repaired CLIs on doubled fsync-evicted history
        run: uv run --locked --managed-python python -B tests/operability_bounded_call_profile.py cgroup-suite --root local/resource-proof
