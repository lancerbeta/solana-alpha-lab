    max_records: 1
- recipe_id: QUERY-CATALOG-RELATED-ASSETS-001
  record_version: '1.0'
  purpose: Traverse declared Catalog relation edges from one asset with breadth-first depth at most two and no inferred authority.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/catalog_cli.py
  - related-assets
  - '{asset_id}'
  - --depth
  - '{depth}'
  - --direction
  - '{direction}'
  - --json
  parameters:
  - name: asset_id
    required: true
    pattern: ^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+$
  - name: depth
    required: true
    pattern: '^[12]$'
  - name: direction
    required: true
    pattern: '^(out|in|both)$'
  target_asset_ids:
  - CATALOG-ROOT-001
  - CATALOG-CLI-001
  - MODULE-CATALOG-DISCOVERY-001
  output_contract:
    format: json
    max_records: 50
