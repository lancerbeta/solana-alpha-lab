schema_version: '1.0'
registry_id: CATALOG-QUERY-REGISTRY-001
as_of: '2026-07-23'
recipes:
- recipe_id: QUERY-CATALOG-VALIDATE-001
  record_version: '1.0'
  purpose: Validate Catalog schemas, paths, references, integrity, and policy without network access.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 60
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/validate_catalog.py
  parameters: []
  target_asset_ids:
  - CATALOG-ROOT-001
  output_contract:
    format: text
    max_records: 100
- recipe_id: QUERY-CATALOG-RESOLVE-ASSET-001
  record_version: '1.0'
  purpose: Resolve one stable asset ID to its canonical metadata record without filesystem search.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/catalog_cli.py
  - resolve-asset
  - '{asset_id}'
  - --json
  parameters:
  - name: asset_id
    required: true
    pattern: ^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+$
  target_asset_ids:
  - CATALOG-ROOT-001
  output_contract:
    format: json
    max_records: 1
- recipe_id: QUERY-CATALOG-RESOLVE-QUERY-001
  record_version: '1.0'
  purpose: Resolve one stable query recipe ID to its bounded read-only execution contract.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/catalog_cli.py
  - resolve-query
  - '{recipe_id}'
  - --json
  parameters:
  - name: recipe_id
    required: true
    pattern: ^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+$
  target_asset_ids:
  - CATALOG-QUERY-REGISTRY-001
  output_contract:
    format: json
    max_records: 1
- recipe_id: QUERY-PRE-GIT-VERIFY-001
  record_version: '1.0'
  purpose: Verify exact imported pre-Git bytes, source-bundle lineage, availability claims, and architecture intent registration.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 60
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/validate_pre_git_import.py
  parameters: []
  target_asset_ids:
  - CATALOG-ASSET-REGISTRY-PRE-GIT-001
  - CATALOG-ASSET-REGISTRY-ARCHITECTURE-001
  - ARCH-INTENT-001
  output_contract:
    format: text
    max_records: 100
- recipe_id: QUERY-CI-VALIDATE-001
  record_version: '1.0'
  purpose: Run the complete platform-neutral repository gate with exact runtime, lock, security, Catalog, generated-view, and test checks.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 120
  command:
  - uv
  - run
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/validate_ci.py
  parameters: []
  target_asset_ids:
  - CI-WORKFLOW-001
  - CI-VALIDATOR-001
  output_contract:
    format: text
    max_records: 100
- recipe_id: QUERY-T05-PIT-RELATION-001
  record_version: '1.0'
  purpose: Read one allow-listed TASK-05 canonical relation at an explicit UTC as-of cutoff with deterministic ordering and a hard row limit.
  kind: duckdb_readonly
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --offline
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/query_task05.py
  - pit-relation
  - --database-path
  - '{database_path}'
  - --relation
  - '{relation}'
  - --as-of
  - '{as_of}'
  - --limit
  - '{limit}'
  parameters:
  - name: database_path
    required: true
    pattern: '^(?!.*[.][.])[^<>|?*"]+[.]duckdb$'
  - name: relation
    required: true
    pattern: '^(?:raw_api_events|canonical_observations|token_lifecycle_events|pool_state_snapshots|trade_orderflow_inputs|entity_input_snapshots|feature_observations|regime_observations|signal_decision_events|quote_attempts|execution_attempts|strategy_outcomes|dataset_manifests|partition_manifests|migration_manifests)$'
  - name: as_of
    required: true
    pattern: '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z$'
  - name: limit
    required: true
    pattern: '^(?:[1-9]|[1-9][0-9]|100)$'
  target_asset_ids:
  - QUERY-RUNNER-T05-PIT-001
  - SCHEMA-T05-REL-RAW-API-EVENTS-001
  - SCHEMA-T05-REL-CANONICAL-OBSERVATIONS-001
  - SCHEMA-T05-REL-TOKEN-LIFECYCLE-EVENTS-001
  - SCHEMA-T05-REL-POOL-STATE-SNAPSHOTS-001
  - SCHEMA-T05-REL-TRADE-ORDERFLOW-INPUTS-001
  - SCHEMA-T05-REL-ENTITY-INPUT-SNAPSHOTS-001
  - SCHEMA-T05-REL-FEATURE-OBSERVATIONS-001
  - SCHEMA-T05-REL-REGIME-OBSERVATIONS-001
  - SCHEMA-T05-REL-SIGNAL-DECISION-EVENTS-001
  - SCHEMA-T05-REL-QUOTE-ATTEMPTS-001
  - SCHEMA-T05-REL-EXECUTION-ATTEMPTS-001
  - SCHEMA-T05-REL-STRATEGY-OUTCOMES-001
  - SCHEMA-T05-REL-DATASET-MANIFESTS-001
  - SCHEMA-T05-REL-PARTITION-MANIFESTS-001
  - SCHEMA-T05-REL-MIGRATION-MANIFESTS-001
  output_contract:
    format: json
    max_records: 100
- recipe_id: QUERY-T05-DECISION-SAFE-OBSERVATIONS-001
  record_version: '1.0'
  purpose: Execute the TASK-05 decision-safe canonical observation macro at an explicit UTC cutoff with deterministic ordering and a hard row limit.
  kind: duckdb_readonly
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --offline
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/query_task05.py
  - decision-safe-observations
  - --database-path
  - '{database_path}'
  - --as-of
  - '{as_of}'
  - --limit
  - '{limit}'
  parameters:
  - name: database_path
    required: true
    pattern: '^(?!.*[.][.])[^<>|?*"]+[.]duckdb$'
  - name: as_of
    required: true
    pattern: '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z$'
  - name: limit
    required: true
    pattern: '^(?:[1-9]|[1-9][0-9]|100)$'
  target_asset_ids:
  - QUERY-RUNNER-T05-PIT-001
  - SCHEMA-T05-CANONICAL-DDL-001
  - SCHEMA-T05-REL-CANONICAL-OBSERVATIONS-001
  output_contract:
    format: json
    max_records: 100
- recipe_id: QUERY-T16-PRIOR-WORK-001
  record_version: '2.0'
  purpose: Search the exact offline TASK-16 fixture or TASK-17 production
    hypothesis research memory at an explicit point-in-time cutoff for
    reusable prior work without automatic rejection or promotion.
  kind: local_command
  read_only: true
  bounded: true
  network_required: false
  write_effects: NONE
  timeout_seconds: 30
  command:
  - uv
  - run
  - --offline
  - --locked
  - --managed-python
  - python
  - -B
  - scripts/query_hypothesis_research_memory.py
  - --memory
  - '{memory_path}'
  - --query-id
  - '{query_id}'
  - --as-of
  - '{as_of}'
  - --max-results
  - '{max_results}'
  - --mechanism-terms
  - '{mechanism_term}'
  parameters:
  - name: memory_path
    required: true
    pattern: ^(?:tests/fixtures/task16/hypothesis_research_memory_v1|docs/evidence/task17/first_bounded_hypothesis_cycle_v1)[.]json$
  - name: query_id
    required: true
    pattern: ^PRIOR-WORK-QUERY-[A-Z0-9]+(?:-[A-Z0-9]+)*$
  - name: as_of
    required: true
    pattern: '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z$'
  - name: max_results
    required: true
    pattern: '^(?:[1-9]|[1-4][0-9]|50)$'
  - name: mechanism_term
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9 _-]{1,119}$'
  target_asset_ids:
  - SCRIPT-T16-PRIOR-WORK-QUERY-001
  - SCHEMA-T16-HYPOTHESIS-LIFECYCLE-RESEARCH-MEMORY-001
  - FIXTURE-T16-HYPOTHESIS-RESEARCH-MEMORY-001
  - DATA-T17-HYPOTHESIS-RESEARCH-MEMORY-001
  output_contract:
    format: json
    max_records: 50
