    Tracked / sampled early pump.fun lifecycle population under the current
    accepted collection contract. Not all Solana, not all memecoins, not all
    pump.fun.
  market_wide_claim: false
tested_context_binding: NOT_AVAILABLE
non_claims:
  - NO_MARKET_WIDE_CLAIM
  - NO_EXPECTED_RETURN
  - NO_TRADE_OR_NO_TRADE
  - NO_BULL_BEAR_OR_COMPOSITE_REGIME
  - NO_TESTED_STRATEGY_CONTEXT_BINDING
  - NO_BOT_AUTHORITY
  - NO_COLLECTOR_HEALTH_INFERENCE
  - NO_ORCH_001
  - NO_DISCOVERY_RANKER
  - NO_PROVIDER
  - NO_DEPLOY
  - NO_LIVE_OR_WALLET
