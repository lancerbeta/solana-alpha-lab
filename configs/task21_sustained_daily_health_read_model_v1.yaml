    operating_state: COLLECTION_STOPPED
    text_ru: Не возобновлять сбор автоматически; запросить отдельное решение A7 либо новый план.
  REVIEW_GAPS_CONTINUE_NO_BACKFILL:
    operating_state: DEGRADED_CONTINUE_NO_BACKFILL
