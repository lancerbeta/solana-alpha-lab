diagnostic_questions:
  - id: Q1_PANEL_COMPLETENESS
    scope: Planned versus observed panels and typed terminal states.
  - id: Q2_ROUTE_AVAILABILITY
    scope: Buy and eligible dependent-sell route availability by tested notional.
  - id: Q3_QUOTE_NOTIONAL_CAPACITY_PROXY
    scope: Largest tested notional with both buy and dependent sell quotes available.
  - id: Q4_ACTUAL_TIME_CHANGE
    scope: Descriptive quote-only change by actual elapsed and availability time.
  - id: Q5_INFORMATION_LIMITS
    scope: Missingness, dependence, and sample-size limits on the owner decision.

