retention_classes:
  DECISION_LINEAGE:
    minimum_retention: PROJECT_LIFETIME
    automatic_expiry: false
    eviction_allowed: false
    rationale: PREVENT_REPEAT_WORK_AND_PRESERVE_WHY_EACH_CANDIDATE_CHANGED_STATE
  UNIQUE_RAW_EVIDENCE:
    minimum_retention: UNTIL_HYPOTHESIS_RETIRED_AND_ALL_DEPENDENT_DATASETS_HOLDOUTS_AND_REPLAYS_EXPIRE
    automatic_expiry: false
    eviction_allowed: false
    deletion_requires:
    - ALL_NAMED_CONSUMERS_RELEASED
    - VERIFIED_BACKUP_AND_FULL_RESTORE_PROOF_CURRENT
    - SEPARATE_OWNER_DELETION_DECISION
  RECONSTRUCTIBLE_CONTENT_CACHE:
    minimum_retention: WHILE_ANY_NAMED_CONSUMER_OR_UNIQUE_AVAILABILITY_EVIDENCE_DEPENDS_ON_BYTES
    automatic_expiry: false
    eviction_allowed: true
    eviction_requires:
    - SOURCE_RECONSTRUCTIBILITY_PROVEN
    - NO_UNIQUE_FIRST_AVAILABILITY_EVIDENCE
    - NO_ACTIVE_NAMED_CONSUMER
    - DETERMINISTIC_CACHE_MANIFEST
    - SEPARATE_DESTRUCTIVE_AUTHORITY
  DERIVED_DATASET:
    minimum_retention: THROUGH_DEPENDENT_TRIAL_HOLDOUT_REPLAY_AND_AUDIT_LIFECYCLE
    automatic_expiry: false
    eviction_allowed: false
  BACKUP_MANIFEST_AND_RECEIPT:
    minimum_retention: PROJECT_LIFETIME
    automatic_expiry: false
    eviction_allowed: false

immutable_storage:
  primary_identity: SHA256_OF_EXACT_BYTES_PLUS_TYPED_MANIFEST
  canonical_write_behavior: CREATE_ONLY_CONTENT_ADDRESSED
  identical_identity_and_bytes: IDEMPOTENT_ACCEPT
  same_semantic_identity_different_bytes: FAIL_CLOSED_EVIDENCE_CONFLICT
  accepted_bytes_overwrite_allowed: false
  mutable_alias_selects_evidence: false
  source_bytes_deleted_after_backup: false

backup:
  destination:
    topology: PRIVATE_SEPARATE_FAILURE_DOMAIN
    provider_neutral: true
    google_drive_is_candidate_not_required_provider: true
    credentials_in_manifest_allowed: false
  trigger: EACH_CLOSED_IMMUTABLE_PARTITION_OR_24_HOURS_WHICHEVER_COMES_FIRST
  maximum_age_hours: 24
  grace_hours: 2
  overdue_after_hours: 26
  disable_new_t2_admissions_after_overdue_hours: 48
  remote_write_behavior: CREATE_ONLY_CONTENT_HASH_NAMED
  existing_same_hash_behavior: DEDUPLICATE_ONLY_AFTER_EXACT_REMOTE_READBACK
  required_every_backup:
  - EXACT_RAW_BYTE_READBACK
  - SHA256_MATCH
  - TYPED_MANIFEST_MATCH
  - DESTINATION_IDENTITY_RECEIPT
  - BACKUP_TIMESTAMP
  current_atom_executes_backup: false

restore_proof:
  routine_sample:
    cadence: P7D
    environment: ISOLATED_EMPTY_RESTORE_ROOT
    algorithm:
      ordered_partitions: SORT_BY_CONTENT_ADDRESS_ASCENDING
      selected_indexes:
      - FIRST
      - LAST
      - SHA256_MANIFEST_MOD_PARTITION_COUNT
      deduplicate_indexes: true
      fewer_than_three_partitions: RESTORE_ALL
    proves: SAMPLED_OBJECT_PERSISTENCE_ONLY
    does_not_prove: FULL_DATASET_RECOVERABILITY
  full_restore:
    environment: ISOLATED_EMPTY_RESTORE_ROOT
    required_before:
    - DATASET_FREEZE
    - DATASET_PROMOTION
    required_after:
    - BACKUP_OR_RESTORE_INCIDENT
    - BACKUP_POLICY_CHANGE
    - BACKUP_RUNTIME_CHANGE
    success_state: DATASET_RECOVERY_PROVEN
    success_requires:
    - ALL_MANIFEST_OBJECTS_RESTORED
    - ALL_RAW_BYTE_SHA256_VALUES_MATCH
    - MANIFEST_IDENTITY_MATCHES
    - DATASET_INVARIANTS_PASS
  current_atom_executes_restore: false

degraded_behavior:
  health_states:
  - HEALTHY
  - BACKUP_OVERDUE
  - RESTORE_OVERDUE
  - EVIDENCE_AT_RISK
  - EVIDENCE_CONFLICT
  - STORAGE_HARD_STOP
  BACKUP_OVERDUE:
    enter_when: LAST_SUCCESSFUL_BACKUP_AGE_EXCEEDS_26_HOURS
    block:
    - DATASET_FREEZE
    - DATASET_PROMOTION
    - DELETION
    owner_escalation_deadline_hours: 2
  BACKUP_OVERDUE_48H:
    enter_when: BACKUP_OVERDUE_DURATION_REACHES_48_HOURS
    disable:
    - NEW_T2_ADMISSIONS
    existing_active_capture: MAY_CONTINUE_ONLY_IF_PRIMARY_STORAGE_AND_INTEGRITY_ARE_HEALTHY
  RESTORE_OVERDUE:
    enter_when: ROUTINE_SAMPLE_RESTORE_AGE_EXCEEDS_P7D
    block:
    - DATASET_FREEZE
    - DATASET_PROMOTION
    owner_escalation_deadline_hours: 24
  EVIDENCE_AT_RISK:
    enter_when: BACKUP_FAILED_OR_PRIMARY_REDUNDANCY_LOST
    disable:
    - NEW_T2_ADMISSIONS
    block:
    - DATASET_FREEZE
    - DATASET_PROMOTION
    owner_escalation_deadline_hours: 2
  EVIDENCE_CONFLICT:
    enter_when: SAME_SEMANTIC_IDENTITY_HAS_DIFFERENT_BYTES
    action:
    - STOP_WRITES_TO_AFFECTED_DATASET
    - PRESERVE_ALL_CONFLICTING_BYTES
    - REQUIRE_OWNER_RECONCILIATION
    owner_escalation_deadline_hours: 0
  STORAGE_HARD_STOP:
    enter_when: STORAGE_BUDGET_GUARD_REJECTS_NEXT_WRITE
    action:
    - STOP_NEW_CAPTURE
    - PRESERVE_ACCEPTED_BYTES
    owner_escalation_deadline_hours: 0

owner_pulse:
  required_metrics:
  - last_closed_partition_at
  - last_successful_backup_at
  - last_successful_backup_sha256
  - backup_age_hours
  - backup_readback_status
  - restore_proof_age_hours
  - restore_proof_scope
  - consecutive_failed_backups
  - local_dataset_bytes
  - free_disk_bytes
  - active_t2_memberships
  - provider_requests_used_and_cap
  - provider_credits_used_and_cap
  - response_bytes_used_and_cap
  - coverage_by_required_field
  - missingness_by_required_field
  - freshness_by_required_field
  - evidence_conflict_state

