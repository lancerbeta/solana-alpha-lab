schema: smial.factory-remote-operations
schema_version: '1.1'
contract_id: FACTORY-REMOTE-OPERATIONS-011
atom_id: FACTORY_REMOTE_OPERATIONS_V1_1
as_of: '2026-08-28'
mode: DIRECT_CURSOR_DELIVERY
implementation: GIT_SIDE_REMOTE_OPS_PROOF
target:
  kind: ONE_ORDINARY_SUPPORTED_LINUX_VPS
  provider: CHERRY_SERVERS
  sku: CLOUD_VPS_4_GEN2
  rejected_sku: CLOUD_VPS_1_GEN2
  vcpu: 4
  ram_gb: 4
  ram_scale_target_gb: 6
  storage_gb: 80
  storage_scale_target_gb: 100
  os: ubuntu-24.04
  location_preference: EU
  payment: CRYPTO_DOCUMENTED
  purchase: OWNER_EXTERNAL_GATE
  plan_url: https://www.cherryservers.com/pricing/virtual-servers/b2-4-4gb-80s-shared
deploy:
  pin_kind: GIT_SHA
  version: factory-remote-ops-v1.0
  previous_version: factory-v1-runtime-v1.0
  rpo_max: 24h
  rto_max: 12h
workbench:
  bind: 127.0.0.1
  port: 8765
  access: SSH_TUNNEL_ONLY
stores:
  kind: SQLITE
  operational_relative: local/factory_v1/operational_state.sqlite
  paper_relative: local/factory_v1/paper_plane_state.sqlite
  observation_schedule_relative: local/factory_v1/observation_schedule_state.sqlite
  owns_scientific_truth: false
backup:
  kind: CONTENT_ADDRESSED_BUNDLE
  independent_sink_relative: local/factory_v1_backup_sink
  source_relative_paths:
    - local/factory_v1/operational_state.sqlite
    - local/factory_v1/paper_plane_state.sqlite
    - local/factory_v1/observation_schedule_state.sqlite
  recursive_relative_paths:
    - local/factory_v1/observation_rdp
  mutable_only_source_relative_paths:
    - local/factory_v1/operational_state.sqlite
    - local/factory_v1/paper_plane_state.sqlite
    - local/factory_v1/observation_schedule_state.sqlite
  mutable_only_recursive_relative_paths:
    - local/factory_v1/observation_rdp/datasets/publication_jobs
  same_parent_forbidden: true
  local_full_schedule: 12h
  local_verified_bundle_retention: 1
  google_drive_role: PROVEN_OFFHOST_DURABILITY
  google_drive_role_prior: OPTIONAL_COLD_COPY_NOT_DOD
  google_drive_role_provenance:
    prior_role: OPTIONAL_COLD_COPY_NOT_DOD
    promoted_by:
      - FACTORY_GOOGLE_DRIVE_OFFHOST_PROOF_V1
      - FACTORY_GOOGLE_DRIVE_OFFHOST_DURABILITY_AUTOMATION_V1
    unproven_follow_up: LIVE_FACTORY_INCREMENTAL_RESTORE_COMMISSIONING
  offhost:
    enabled: true
    remote_name: factory-gdrive
    destination_root: solana-alpha-lab/factory-backups
    rclone_config_absolute: /etc/solana-alpha-lab/rclone.conf
    rclone_bin: /usr/bin/rclone
    receipt_relative: local/factory_v1/offhost_backup_receipt.json
    freshness_current_max_seconds: 86400
    freshness_degraded_max_seconds: 172800
    daily_delta: true
    weekly_full: true
    weekly_weekday_utc: 6
    owner_traffic_target_30d_bytes: 300000000000
    internal_payload_planning_budget_30d_bytes: 240000000000
monitoring:
  freshness_max_seconds: 900
  stall_max_seconds: 1800
  disk_used_percent_max: 85
  heartbeat_relative: local/factory_v1/paper_heartbeat.json
  observation_heartbeat_relative: local/factory_v1/observation_schedule_heartbeat.json
alert:
  sink: TELEGRAM_BOT_API
  token_env: FACTORY_TELEGRAM_BOT_TOKEN
  chat_id_env: FACTORY_TELEGRAM_CHAT_ID
  dedup: true
security:
  sshd_relative: configs/factory_remote_ops/sshd_factory.conf
  nftables_relative: configs/factory_remote_ops/nftables_factory.conf
  fail2ban_relative: configs/factory_remote_ops/fail2ban_sshd.local
  secrets_example_relative: configs/factory_remote_ops/secrets.env.example
  password_ssh: false
  permit_root_login: false
  public_admin: false
units:
  workbench_relative: configs/factory_v1_linux_runtime/factory-v1-workbench.service
  health_relative: configs/factory_remote_ops/factory-remote-health.service
  backup_service_relative: configs/factory_remote_ops/factory-remote-backup.service
  backup_timer_relative: configs/factory_remote_ops/factory-remote-backup.timer
  backup_gdrive_service_relative: configs/factory_remote_ops/factory-remote-backup-gdrive.service
  backup_gdrive_timer_relative: configs/factory_remote_ops/factory-remote-backup-gdrive.timer
  backup_gdrive_delta_service_relative: configs/factory_remote_ops/factory-remote-backup-gdrive-delta.service
  backup_gdrive_delta_timer_relative: configs/factory_remote_ops/factory-remote-backup-gdrive-delta.timer
  paper_heartbeat_relative: configs/factory_remote_ops/factory-paper-heartbeat.service
  observation_schedule_service_relative: configs/factory_remote_ops/factory-observation-schedule.service
  observation_schedule_timer_relative: configs/factory_remote_ops/factory-observation-schedule.timer
  collector_owner_pulse_service_relative: configs/factory_remote_ops/factory-collector-owner-pulse.service
  collector_owner_pulse_timer_relative: configs/factory_remote_ops/factory-collector-owner-pulse.timer
health:
  process_alive_alone_is_not_healthy: true
  healthy_verdict_forbidden: true
  backup_status_when_unproved: EXPLICIT_UNKNOWN
authority:
  provider_calls: false
  credentials: false
  deployment: false
  cash_spend: false
  wallet_signer_transaction: false
