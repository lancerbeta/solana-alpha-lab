schema: smial.hypothesis-forge-independent-critic
schema_version: '1.1'
contract_id: HYPOTHESIS_FORGE_OPERATIONAL_CLOSURE_V1
prompt_version: HFIC-V1.1
as_of: '2026-08-26'
generator_mode: MANUAL_FALLBACK_UNTIL_GENERATOR
runtime_mode: EXPLICIT_SLASH_ONLY
forge_invocation:
  mode: EXPLICIT_SLASH_ONLY
  slash_commands:
    - hypothesis-forge
critic_launch:
  mode: AUTO_AFTER_SYNTHESIS
  context_isolation: NEW_CONTEXT_REQUIRED
  recovery_slash_commands:
    - independent-hypothesis-critic
commissioning_gate:
  required_owner_terminal: NO_GIT_FAST_LANE_PROVEN
  auto_commission_offline_when_safe: true
session_memory:
  backend: EXISTING_RESEARCH_STORE
  append_only: true
  persist_all_candidates: true
  resume_incomplete: true
candidate_policy:
  min_candidates: 4
  max_candidates: 6
  selected_count: 1
  runner_up_count: 1
  max_revisions: 1
search_budget:
  auto_sessions_per_evidence_epoch: 1
  distinct_focus_sessions_per_evidence_epoch: 3
  same_search_key_replay: RETURN_EXISTING_SESSION
identity:
  canonical_content_hash: SHA256
  display_ordinal_is_identity: false
operator_pack:
  path: docs/operator/HYPOTHESIS_FORGE_AND_INDEPENDENT_CRITIC_OPERATOR_V1.md
skills:
  forge: .agents/skills/hypothesis-forge/SKILL.md
  critic: .agents/skills/independent-hypothesis-critic/SKILL.md
cli:
  entrypoint: scripts/hypothesis_forge.py
schemas:
  critic_input: catalog/schemas/hypothesis_critic_input_v1.schema.json
  synthesis_handoff: catalog/schemas/hypothesis_forge_synthesis_handoff_v1.schema.json
  synthesis_handoff_v1_1: catalog/schemas/hypothesis_forge_synthesis_handoff_v1_1.schema.json
  forge_draft: catalog/schemas/hypothesis_forge_draft_v1.schema.json
  critic_result: catalog/schemas/hypothesis_critic_result_v1.schema.json
  session_receipt: catalog/schemas/hypothesis_forge_session_receipt_v1.schema.json
synthesis_invariants:
  forge_complete_requires:
    - FORGE_REPORT
    - CRITIC_INPUT_PACKET
  synthesis_complete_requires:
    - critic_terminal
    - critic_report
  forbidden_without_owner_contract:
    - autonomous_hypothesis_generator
    - experiment_execution
    - git_mutation
    - provider_api_rpc_wss_calls
authority:
  git_mutation: 0
  experiment_execution: 0
  provider_api_rpc_wss_calls: 0
  credential_reads: 0
  cash_spend_usd_cents: 0
  wallet_signer_transaction_actions: 0
slash_session_authority:
  invocation: ONE_SLASH_ONE_SESSION
  expires_at: FINAL_TERMINAL_OR_STOP
  mid_cycle_owner_interventions: 0
  token: ZERO_MID_CYCLE_OWNER_INTERVENTION
  auto_continue:
    - PASS_TO_CLASSIFICATION
    - REVISE_ONCE
  isolated_critic_unavailable: AUTO_HANDOFF_UNAVAILABLE
  silent_self_critic_forbidden: true
  batch_approval_at_cycle_start_only: true
  authorized_without_mid_cycle_prompt:
    - read_only_git_catalog_active_rdp
    - preflight
    - safe_offline_commissioning
    - process_owned_os_temp_files
    - append_only_rdp_context_session_candidates_critic_revision_classifier_finalize
    - automatic_isolated_critic_handoff
    - exactly_one_bounded_revise_once
    - network_free_deterministic_lane_classification
    - replay_resume_prove_runtime
    - cleanup_process_owned_temp_files
  still_requires_explicit_owner_authority:
    - git_mutation_branch_commit_pr_task
    - experiment_execution
    - provider_api_rpc_wss_or_public_market_data
    - cash_spend
    - untouched_forward_holdout
    - wallet_signer_transaction
    - deployment_or_promotion
    - production_strategy_bot_execution
    - destructive_rdp_mutation
    - new_capability_atom
    - reopen_completed_search
    - provenance_correction_append_until_merge_phrase
  provenance_correction:
    not_part_of_slash: true
    when: AFTER_EXACT_OWNER_MERGE_PHRASE
    read_command: inventory-placeholder-times
    write_command: apply-provenance-correction
    write_confirm_flag: --confirm-append-only
    fail_closed_uncovered: PROVENANCE_TIME_UNCOVERED
    statuses:
      - VALID
      - CORRECTED_ORIGINAL_UNKNOWN
  pass_fast_lane_ready: STOP_BEFORE_EXPERIMENT
  pass_change_lane_required: RETURN_PRD_SSD_DO_NOT_CREATE_PR
  pass_data_option_required: RETURN_DATA_OPTION_DO_NOT_COLLECT
