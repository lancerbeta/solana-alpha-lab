      - event_time_does_not_prove_local_availability
    security_and_privacy:
      - no_sign_or_send_in_TASK01_or_TASK07
      - no_credentials_in_artifacts
    operations_and_tco: Managed provider still required for measured reliability; specification itself has no project cash purchase.
    decision: ADOPT_AS_REFERENCE
