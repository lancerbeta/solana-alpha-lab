gate:
  order:
    - ADOPT
    - WRAP
    - FORK
    - BUILD
  rules:
    ADOPT: Use an official specification, catalog or compatible component without recreating it.
    WRAP: Put a thin project-owned contract around a service/component while preserving raw evidence and an exit path.
    FORK: Fork only with license compatibility, pinned source, a maintenance owner and a material unmet need.
    BUILD: Build only after the first three gates fail against a named requirement.
  no_decision_from_popularity_only: true
  minimum_review_dimensions:
    - official_provenance
    - license_or_terms
    - maturity_and_change_risk
    - point_in_time_and_truth_limits
    - signer_and_secret_boundary
    - telemetry_and_privacy
    - operations_and_total_cost
    - pin_update_and_exit_path

decision_vocabulary:
  ADOPT_AS_REFERENCE: Adopt authoritative semantics/catalog reference; do not create runtime dependency by implication.
  WRAP_FOR_TASK07: Retain for controlled non-transactional comparison under a project-owned interface.
  DEFER: Do not introduce now; preserve as a measured-gap option.
  REJECT_INITIAL_SPINE: Do not use as the initial project architecture; reconsider only through an explicit ADR.

candidates:
