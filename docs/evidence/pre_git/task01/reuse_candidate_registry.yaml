material_findings:
  - issue_id: REUSE-MAT-001
    severity: HIGH
    claim: A second unsigned quote source may cheaply separate Jupiter-specific route gaps from market route death.
    evidence: Raptor hosted API is documented as public beta, currently free and without stated rate limits.
    decision: Retain only as a TASK-07 controlled comparison candidate after due diligence; do not call or adopt runtime now.
  - issue_id: REUSE-MAT-002
    severity: MEDIUM
    claim: Birdeye Standard plus x402 pay-per-request is available.
    evidence: Direct retrieval of the official Birdeye x402 reference confirms keyless per-request USDC on Solana, route-specific payment terms, replay protection and 100 RPS per-IP pre-payment limit.
    decision: Accept product availability; keep Standard and x402 as separate access paths, do not invent route prices, and defer all request/sign/payment activity until a measured gap and explicit security/cost gate.
  - issue_id: REUSE-MAT-003
    severity: MEDIUM
    claim: Open-source trading or archive frameworks automatically shorten the initial path.
    evidence: Vixen adds Rust/gRPC coupling; Old Faithful is RFC/not-production and AGPL; Hummingbot has broad dependency, telemetry and signer surfaces.
    decision: Reuse specifications and ideas now; defer runtime frameworks until a measured bottleneck or validated edge exists.

