schema_version: "1.0.0"

artifact:
  artifact_id: SMIAL_TASK_01_SOURCES
  artifact_version: "1.0"
  task_id: TASK-01
  task_execution_status: DONE
  artifact_status: VALIDATED_SOURCE_CONTRACT
  owner: user+assistant
  created_at: "2026-07-18"
  as_of: "2026-07-18"
  entry_verdict: START_AS_WRITTEN
  canonical_after_validation: true
  canonical_sources_sync: PREPARED_FOR_CANONICAL_HANDOFF_USER_ACTIVATION_PENDING
  contains_secrets: false
  api_rpc_provider_requests_executed: false
  endpoint_probing_executed: false
  accounts_created: false
  purchases_executed: false
  downstream_artifacts:
    - data_option_tiers_v1.yaml
    - provider_cost_snapshot_v1.csv
    - reuse_candidate_registry.yaml
    - provider_decision_v1.md
    - provider_account_checklist_v1.md
    - provider_smoke_spec_v1.yaml

task_boundary:
  permitted:
    - official_documentation_research
    - static_contract_design
    - local_artifact_creation
    - static_validation
  prohibited:
    - api_requests
    - rpc_requests
    - websocket_connections
    - endpoint_probing
    - quota_or_latency_measurement
    - account_creation
    - plan_purchase
    - transaction_build_simulate_sign_send
    - external_writes
  controlled_requests_owner_task: TASK-07
  real_execution_owner_tasks:
    - TASK-25
    - TASK-26
    - TASK-29

global_rules:
  provider_schema_is_canonical_schema: false
  indexed_provider_is_protocol_truth: false
  candle_or_spot_price_proves_fillability: false
  historical_catalog_creates_past_strategy_availability: false
  missing_timeout_no_route_equals_zero: false
  raw_payload_before_normalization: true
  append_only_observation_envelope: true
  secret_storage:
    allowed_locations:
      - local_secret_store_defined_after_TASK-02
      - local_env_file_excluded_from_git
    forbidden_locations:
      - chat
      - project_sources
      - git
      - logs
      - screenshots
    never_collect:
      - seed_phrase
      - private_key
      - wallet_backup
      - session_cookie
      - api_key_fragment
  procurement:
    required_payment_preference: ANY_CRYPTO_ASSET_ACCEPTED_BY_SERVICE
    decision_order:
      - technical_data_execution_truth
      - security_terms_reliability_and_DoD
      - documented_crypto_payment_preference
      - total_cost_of_ownership
      - convenience
    free_plan_has_no_payment_penalty: true
    fiat_only_exception_requires_user_approval: true
    purchase_requires_measured_bottleneck: true
    automatic_wallet_charge_default: disabled
    payment_action_owner: user

evidence_state_vocabulary:
  official_docs: Public official documentation retrieved and inspected.
  official_repo: Official source repository inspected; commit pin may still be pending.
  official_dashboard_needed: Authenticated dashboard or sanitized user attestation is required.
  conflict: Two official claims cannot yet be reconciled without dashboard or TASK-07 evidence.
  task07_validation_required: Runtime schema, coverage, error, quota or latency claim is untested.
  internal_design: Project contract only; implementation is downstream.
  unknown: No sufficient official evidence found.

truth_layers:
  PROTOCOL_TRUTH:
    authority:
      - raw_solana_account_and_transaction_state
      - official_program_idl_and_program_documentation
      - explicit_slot_and_commitment
    disallowed_substitutes:
      - vendor_risk_score
      - vendor_entity_label
      - candle
      - human_readable_parser_without_raw_lineage
  TRANSPORT_OR_INDEX:
    authority:
      - request_and_delivery_evidence_for_that_provider
      - indexed_or_parsed_record_with_provider_version
    not_authoritative_for:
      - protocol_state_without_raw_cross_check
      - point_in_time_availability_before_local_observation
  EXECUTABLE_QUOTE_REALITY:
    authority:
      - exact_mint_amount_direction_and_time_quote
      - route_fee_context_and_error_or_no_route
    disallowed_substitutes:
      - candle_close
      - spot_price_endpoint
      - reserve_formula_alone
      - historical_swap_price
  LOCAL_OBSERVATION_TRUTH:
    authority:
      - request_and_response_timestamps
      - raw_payload_hash
      - failure_and_retry_chain
      - provider_plan_and_credit_observation
      - revision_link
  DERIVED_PIT:
    authority:
      - deterministic_versioned_derivation_from_rows_available_at_decision_time

timestamp_contract:
  required_when_applicable:
    - event_time
    - observed_at
    - available_to_strategy_at
    - ingested_at
  initial_first_reliable_available_at: UNSET_UNTIL_VALIDATED
  rules:
    event_time_is_not_observed_at: true
    provider_response_time_is_not_chain_event_time: true
    backfill_may_not_predate_first_reliable_available_at: true
    commitment_must_be_stored_for_chain_observations: true
    provider_clock_and_local_clock_must_not_be_silently_merged: true

sources:
  - source_id: SOLANA_RPC_PROTOCOL
    display_name: Solana RPC and program state
    source_class: protocol_interface
    candidate_decision: ADOPT_AS_REFERENCE
    truth_layers:
      - PROTOCOL_TRUTH
    authoritative_for:
      - raw_account_state
      - raw_transaction_and_status
      - slot_blockhash_commitment_and_network_state
      - token_accounts_and_supply
    prohibited_uses:
      - treating_shared_public_rpc_as_production_transport
      - inferring_strategy_availability_from_event_time_only
    official_evidence:
      - evidence_id: SOLANA_RPC_OVERVIEW
        url: https://solana.com/docs/rpc
        state: official_docs
        as_of: "2026-07-18"
        fact_summary: HTTP and WebSocket methods expose network state and subscriptions; public endpoints are shared and not intended for production.
    products:
      - product_id: SOLANA_JSON_RPC_INTERFACE
        endpoint_class: HTTP_RPC
        base_url: UNSET_UNTIL_TASK07
        method_classes:
          - account_and_program_reads
          - transaction_and_signature_reads
          - token_account_and_supply_reads
          - slot_blockhash_commitment_reads
          - prioritization_fee_reads
        runtime_permission: TASK07_CONTROLLED_READS_ONLY
      - product_id: SOLANA_WEBSOCKET_INTERFACE
        endpoint_class: WEBSOCKET
        base_url: UNSET_UNTIL_TASK07
        method_classes:
          - account_subscriptions
          - program_subscriptions
          - log_subscriptions
          - signature_subscriptions
        runtime_permission: TASK07_CONTROLLED_SUBSCRIPTIONS_ONLY
    auth:
      account_state: NOT_APPLICABLE_FOR_INTERFACE_SPEC
      credential_state: NONE
      production_provider: UNSET_UNTIL_TASK07
    payment:
      mode: not_applicable
      paid_transport_selection: UNSET_UNTIL_TASK07
    observation_contract:
      event_time: block_time_or_null_with_slot
      observed_at: local_receive_time
      available_to_strategy_at: local_validated_receive_time
      ingested_at: raw_envelope_persist_time
      revisions:
        - commitment_progression
        - processed_fork_rollback
        - provider_archive_or_history_limit
      raw_retention_required: true
      missing_policy: preserve_null_or_error_with_method_and_commitment
    validation:
      current_state: official_docs
      required_task: TASK-07
      assertions:
        - commitment_and_context_slot_are_preserved
        - public_endpoint_is_not_used_as_production_SLA

  - source_id: PUMP_PUBLIC_PROTOCOL_DOCS
