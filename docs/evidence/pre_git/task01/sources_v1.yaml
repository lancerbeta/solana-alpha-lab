      revisions:
        - market_data_backfill
        - security_label_change
        - package_or_endpoint_change
      raw_retention_required: true
      failure_classes_to_preserve:
        - timeout
        - rate_limit_429
        - provider_4xx
        - provider_5xx
        - empty_result
    validation:
      current_state: task07_validation_required
      required_task: TASK-07_IF_RETAINED
      assertions:
        - no_long_subscription_before_free_or_shortlist_evidence
        - price_or_OHLCV_is_not_executable_quote_truth

  - source_id: DUNE_SOLANA_CATALOG
    display_name: Dune Solana data catalog
    source_class: historical_catalog
    candidate_decision: ADOPT_AS_REFERENCE
    truth_layers:
      - TRANSPORT_OR_INDEX
    authoritative_for:
      - its_historical_indexed_rows_and_decoded_tables
    not_authoritative_for:
      - live_universe_discovery
      - local_observed_at
      - local_available_to_strategy_at
      - executable_quote_or_fill
    official_evidence:
      - evidence_id: DUNE_SOLANA_OVERVIEW
        url: https://docs.dune.com/data-catalog/solana/overview
        state: official_docs
        as_of: "2026-07-18"
        fact_summary: Raw and decoded Solana transactions, blocks, instructions and account activity are indexed.
    products:
      - product_id: DUNE_SOLANA_TABLES
        endpoint_class: HISTORICAL_SQL_CATALOG
        intended_role: discovery_backfill_cross_check
        runtime_permission: REFERENCE_DESIGN_ONLY_IN_TASK01
    auth:
      account_state: NOT_CREATED
      credential_state: NONE
    payment:
      mode: not_evaluated
      reason: no_purchase_or_runtime_dependency_selected
    observation_contract:
      event_time: indexed_chain_time_and_slot_when_available
      observed_at: local_query_response_time_if_ever_queried
      available_to_strategy_at: never_backdated_before_local_retrieval
      ingested_at: local_raw_export_persist_time_if_ever_used
      revisions:
        - decoder_update
        - table_backfill
        - schema_change
      raw_retention_required: true
    validation:
      current_state: official_docs
      required_task: TASK07_OR_LATER_IF_SELECTED
      assertions:
        - catalog_rows_do_not_fabricate_historical_strategy_knowledge
        - export_license_terms_and_freshness_are_checked_before_dependency

  - source_id: LOCAL_OBSERVATION_PIPELINE
    display_name: SMIAL local append-only observation and derivation layer
    source_class: internal_system
    candidate_decision: BUILD_MINIMUM_NECESSARY
    truth_layers:
      - LOCAL_OBSERVATION_TRUTH
      - DERIVED_PIT
    authoritative_for:
      - local_request_response_and_ingestion_times
      - raw_payload_hash_and_revision_lineage
      - local_failure_retry_and_disagreement_evidence
      - point_in_time_derived_features_and_outcomes
      - provider_credit_cash_storage_and_QA_telemetry
    prohibited_uses:
      - overwriting_raw_observations
      - backdating_first_reliable_available_at
      - converting_missing_timeout_or_no_route_to_zero
      - storing_secrets_or_payment_wallet_details
    official_evidence: []
    products:
      - product_id: RAW_ENVELOPE
        endpoint_class: INTERNAL_APPEND_ONLY_STORAGE
        implementation_task: TASK-06
      - product_id: NORMALIZED_CONTRACTS
        endpoint_class: INTERNAL_VERSIONED_SCHEMA
        implementation_task: TASK-05
      - product_id: PROVIDER_SMOKE_HARNESS
        endpoint_class: INTERNAL_CONTROLLED_VALIDATOR
        implementation_task: TASK-07
    auth:
      account_state: NOT_APPLICABLE
      credential_state: NONE_IN_ARTIFACTS
    payment:
      mode: not_applicable
    observation_contract:
      event_time: source_specific_event_time_or_null
      observed_at: monotonic_local_receive_time_plus_UTC_wall_time
      available_to_strategy_at: first_time_record_passes_minimum_strategy_validation
      ingested_at: durable_append_commit_time
      revisions:
        - append_new_revision_only
      raw_retention_required: true
      required_lineage:
        - provider_source_id
        - product_id
        - request_class
        - sanitized_request_hash
        - raw_payload_hash
        - schema_version
        - program_or_decoder_version_when_applicable
        - revision_of_observation_id_or_null
        - disagreement_id_or_null
    validation:
      current_state: internal_design
      required_tasks:
        - TASK-05
        - TASK-06
        - TASK-07
      assertions:
        - idempotent_append_and_deduplication_are_distinct
        - raw_and_normalized_rows_are_replayable
        - first_reliable_available_at_starts_only_after_validation

