schema: smial.control_only_task_close_fast_path
schema_version: '1.0'
policy_id: CONTROL_ONLY_TASK_CLOSE_FAST_PATH_V1
as_of: '2026-08-09'
status: OBSERVATION_WINDOW_PENDING_FIRST_ELIGIBLE_CLOSE
purpose: >-
  Admit one prospective combined Project Sources activation-and-task-close
  transaction to a focused local gate while retaining exact-head PR and main CI.
eligible_change_set:
  receipt_path_pattern: '^docs/evidence/task(?P<task_key>[0-9]+[a-z]?)/[a-z0-9_]*project_sources_activation_and_task_close_acceptance_v[0-9]+\.json$'
  required_modified_paths:
    - docs/project_sources/release_registry_v1.yaml
    - catalog/assets/core.yaml
    - catalog/assets/lifecycle.yaml
    - catalog/catalog_manifest.yaml
    - catalog/generated/asset_edges.json
    - docs/PROJECT_MAP.md
  added_receipt_count: 1
  other_added_paths: FORBIDDEN
  deleted_paths: FORBIDDEN
  renamed_paths: FORBIDDEN
  tests_or_validation_policy_changes: FORBIDDEN
combined_receipt:
  schema: smial.project_sources.activation.receipt
  schema_version: '1.0'
  evidence_class: OWNER_ATTESTATION
  smoke_outcome: PASS
  owner_terminal_template: 'TASK{task_label}_SOURCE_SMOKE=PASS; OWNER_DONE_ACCEPTANCE'
  source_smoke_template: 'TASK{task_label}_SOURCE_SMOKE=PASS'
  done_acceptance: OWNER_DONE_ACCEPTANCE
  task_status: DONE
  canonical_task_done: true
  next_task_selected: false
  allowed_factory_fit_verdicts:
    - PASS
    - PASS_WITH_LIMITATIONS
  required_zero_authority_fields:
    - provider_api_rpc_wss_calls
    - credential_uses
    - r2_r3_reads
    - wallet_signer_transaction_actions
    - cash_spend_usd_cents
    - dependency_changes
    - project_sources_ui_changes
  disposition_kind: ACTIVATION_RECEIPT
  registry_path: docs/project_sources/release_registry_v1.yaml
validation:
  local_mode: FOCUSED_FAIL_CLOSED
  full_validation_owner: GITHUB_PR_EXACT_HEAD_CI
  post_merge_validation: GITHUB_MAIN_EXACT_HEAD_CI
  fallback_command: uv run --locked --managed-python python -B scripts/validate_ci.py --tracked-only-delivery
  local_checks:
    - DIFF_CHECK
    - SECRET_SCAN
    - CATALOG_VALIDATION
    - GENERATED_NAVIGATION
    - PROJECT_SOURCES_AND_FAST_PATH_TESTS
observation_window:
  eligible_closes_required: 3
  local_wall_seconds_cap: 120
  success_requires_zero_repair_commits: true
rollback_triggers:
  - FALSE_ELIGIBILITY_CLASSIFICATION
  - MISSED_SOURCE_REGISTRY_OR_CATALOG_DRIFT
  - REMOTE_FAILURE_LOCAL_GATE_SHOULD_HAVE_CAUGHT
  - ELIGIBLE_CHANGE_SET_CHANGED
non_claims:
  - FAST_PATH_PASS_DOES_NOT_ACTIVATE_PROJECT_SOURCES
  - FAST_PATH_PASS_DOES_NOT_GRANT_CANONICAL_DONE
  - FAST_PATH_PASS_DOES_NOT_GRANT_NEXT_TASK_OR_EXTERNAL_AUTHORITY
  - FAST_PATH_DOES_NOT_APPLY_TO_IMPLEMENTATION_OR_REPAIR_DIFFS
