[project]
name = "solana-alpha-lab"
version = "0.0.0"
description = "Bounded evidence-first Solana memecoin intraday alpha research."
requires-python = ">=3.13,<3.14"
dependencies = [
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "duckdb==1.5.5",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "solana==0.40.1",
  "solders==0.28.0",
  "prometheus-client==0.25.0",
]

[dependency-groups]
dev = [
    "ruff==0.11.12",
]
security = [
  "pip-audit==2.10.1",
]

[tool.uv]
package = false
required-version = "==0.11.29"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.solana-alpha-lab]
exact_python_pin = "3.13.14"
powershell_compatibility = ">=7.6.0,<8.0.0"
provider_calls_allowed = false
real_money_allowed = false
